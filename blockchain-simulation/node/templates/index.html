<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WobblyToken</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .col {
      flex: 1 1 320px;
      min-width: 280px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      margin-top: 6px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      display: block;
      margin-bottom: 12px;
    }

    pre {
      background: #020617;
      padding: 16px;
      border-radius: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 180px;
    }

    .muted {
      color: #94a3b8;
      font-size: 14px;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ef4444;
    }

    #miningStatus {
      display: none;
      margin-top: 12px;
      color: #93c5fd;
      font-weight: bold;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 3px solid #94a3b8;
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>WobblyToken UI</h1>
      <p class="muted">
        Node actuel : <strong>{{ node_name }}</strong><br>
        Peer : <strong>{{ peer }}</strong>
      </p>
    </div>

    <div class="card">
      <h2>Actions blockchain</h2>
      <div class="actions">
        <button id="mineBtn" onclick="mineBlock()">Miner un bloc</button>
        <button onclick="syncChain()">Sync</button>
        <button onclick="showChain()">Voir la blockchain</button>
        <button onclick="showTransactions()">Voir les transactions</button>
      </div>

      <p id="miningStatus">
        <span class="spinner"></span>
        Minage en cours...
      </p>
    </div>

    <div class="card">
      <h2>Wallets</h2>
      <div class="row">
        <div class="col">
          <h3>Sender</h3>
          <div class="actions">
            <button onclick="generateWallet('sender')">Générer wallet sender</button>
          </div>

          <label>
            Sender private key
            <textarea id="sender_private_key" placeholder="Clé privée du sender"></textarea>
          </label>

          <label>
            Sender public key
            <textarea id="sender_public_key" placeholder="Clé publique du sender"></textarea>
          </label>

          <label>
            Sender address
            <input type="text" id="sender_address" placeholder="Adresse du sender">
          </label>
        </div>

        <div class="col">
          <h3>Receiver</h3>
          <div class="actions">
            <button onclick="generateWallet('receiver')">Générer wallet receiver</button>
          </div>

          <label>
            Receiver address
            <input type="text" id="receiver_address" placeholder="Adresse du receiver">
          </label>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Transaction</h2>

      <label>
        Amount
        <input type="number" id="amount" placeholder="10" step="any" min="0">
      </label>

      <label>
        Signature
        <textarea id="signature" placeholder="La signature sera générée automatiquement"></textarea>
      </label>

      <div class="actions">
        <button onclick="signTransaction()">Signer la transaction</button>
        <button onclick="sendTransaction()">Envoyer la transaction</button>
      </div>

      <p id="status"></p>
    </div>

    <div class="card">
      <h2>Résultat</h2>
      <pre id="output">Clique sur un bouton…</pre>
    </div>
  </div>

  <script>
    const output = document.getElementById("output");
    const statusEl = document.getElementById("status");

    function setOutput(data) {
      output.textContent =
        typeof data === "string" ? data : JSON.stringify(data, null, 2);
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "success";
    }

    async function mineBlock() {
      const miningStatus = document.getElementById("miningStatus");
      const mineButton = document.getElementById("mineBtn");

      try {
        mineButton.disabled = true;
        miningStatus.style.display = "block";
        setStatus("Minage en cours...");

        const res = await fetch("/mine");
        const data = await res.json();

        setOutput(data);
        setStatus("Bloc miné avec succès.");
      } catch (err) {
        setStatus("Erreur pendant le minage.", true);
      } finally {
        miningStatus.style.display = "none";
        mineButton.disabled = false;
      }
    }

    async function syncChain() {
      try {
        const res = await fetch("/sync");
        const data = await res.json();
        setOutput(data);
        setStatus("Synchronisation terminée.");
      } catch (err) {
        setStatus("Erreur pendant le sync.", true);
      }
    }

    async function showChain() {
      try {
        const res = await fetch("/chain");
        const data = await res.json();
        setOutput(data);
        setStatus("Blockchain chargée.");
      } catch (err) {
        setStatus("Erreur pendant le chargement de la blockchain.", true);
      }
    }

    async function showTransactions() {
      try {
        const res = await fetch("/transaction");
        const data = await res.json();
        setOutput(data);
        setStatus("Transactions chargées.");
      } catch (err) {
        setStatus("Erreur pendant le chargement des transactions.", true);
      }
    }

    async function generateWallet(target) {
      try {
        const res = await fetch("/generate_keys");
        const data = await res.json();

        setOutput(data);

        if (!res.ok) {
          setStatus(data.message || "Erreur pendant la génération des clés.", true);
          return;
        }

        if (target === "sender") {
          document.getElementById("sender_private_key").value = data.private_key || "";
          document.getElementById("sender_public_key").value = data.public_key || "";
          document.getElementById("sender_address").value = data.address || "";
          setStatus("Wallet sender généré.");
        } else {
          document.getElementById("receiver_address").value = data.address || "";
          setStatus("Wallet receiver généré.");
        }
      } catch (err) {
        setStatus("Erreur pendant la génération des clés.", true);
      }
    }

    async function signTransaction() {
      const sender_address = document.getElementById("sender_address").value.trim();
      const sender_public_key = document.getElementById("sender_public_key").value.trim();
      const receiver_address = document.getElementById("receiver_address").value.trim();
      const private_key = document.getElementById("sender_private_key").value.trim();
      const amount = Number(document.getElementById("amount").value);

      if (
        !sender_address ||
        !sender_public_key ||
        !receiver_address ||
        !private_key ||
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        setStatus("Remplis d'abord sender, receiver, amount et la private key.", true);
        return;
      }

      try {
        const res = await fetch("/sign_transaction", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sender_address,
            sender_public_key,
            receiver_address,
            amount,
            private_key
          })
        });

        const data = await res.json();
        setOutput(data);

        if (res.ok) {
          document.getElementById("signature").value = data.signature || "";
          setStatus("Transaction signée avec succès.");
        } else {
          setStatus(data.message || "Erreur pendant la signature.", true);
        }
      } catch (err) {
        setStatus("Erreur pendant la signature.", true);
      }
    }

    async function sendTransaction() {
      const sender_address = document.getElementById("sender_address").value.trim();
      const sender_public_key = document.getElementById("sender_public_key").value.trim();
      const receiver_address = document.getElementById("receiver_address").value.trim();
      const signature = document.getElementById("signature").value.trim();
      const amount = Number(document.getElementById("amount").value);

      if (
        !sender_address ||
        !sender_public_key ||
        !receiver_address ||
        !signature ||
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        setStatus("Remplis tous les champs correctement puis signe la transaction.", true);
        return;
      }

      const tx = {
        sender_address,
        sender_public_key,
        receiver_address,
        amount,
        signature
      };

      try {
        const res = await fetch("/transaction", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(tx)
        });

        const data = await res.json();
        setOutput(data);

        if (res.ok) {
          setStatus(data.message || "Transaction envoyée.");
        } else {
          setStatus(data.message || "Transaction refusée.", true);
        }
      } catch (err) {
        setStatus("Erreur pendant l’envoi de la transaction.", true);
      }
    }
  </script>
</body>
</html>
